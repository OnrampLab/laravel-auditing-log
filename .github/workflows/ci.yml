name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  lint:
    name: Lint (Laravel 13 / PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl
          coverage: none
          tools: composer:v2, phive

      - name: Install phpDocumentor
        run: phive install --force-accept-unsigned --trust-gpg-keys 67F861C3D889C656 phpDocumentor

      - name: Install dependencies
        run: tools/scripts/ci-install.sh 13 --with-tools

      - name: Run PHPCS
        run: tools/scripts/phpcs-all-files.sh

      - name: Run PHP insights
        run: composer insights

      - name: Run rector
        run: composer rector

      - name: Do static analysis
        run: vendor/bin/phpstan

      - name: Build documents
        run: composer docs

      - uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: build/api/

  test:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '8', php: '8.0' }
          - { laravel: '8', php: '8.1' }
          - { laravel: '9', php: '8.0' }
          - { laravel: '9', php: '8.2' }
          - { laravel: '10', php: '8.1' }
          - { laravel: '10', php: '8.3' }
          - { laravel: '11', php: '8.2' }
          - { laravel: '11', php: '8.4' }
          - { laravel: '12', php: '8.2' }
          - { laravel: '12', php: '8.5' }
          - { laravel: '13', php: '8.3' }
          - { laravel: '13', php: '8.5' }
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: tools/scripts/ci-install.sh ${{ matrix.laravel }}

      - name: Test
        run: tools/scripts/run-tests.sh
